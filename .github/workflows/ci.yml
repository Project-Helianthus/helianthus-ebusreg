name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      skip_full: ${{ steps.gate.outputs.skip_full }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      manifest: ${{ steps.gate.outputs.manifest }}
      donor_repository: ${{ steps.gate.outputs.donor_repository }}
      donor_sha: ${{ steps.gate.outputs.donor_sha }}
      packages: ${{ steps.gate.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: gate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/preflight/schedule.py gate

  terminology:
    needs: [classify]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify.outputs.skip_full != 'true') }}
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: |
          # Phase C M-C6: AddressByRole(SlotRole) test documents
          # the eBUS-spec SlotRoleMaster/SlotRoleSlave enum values.
          if git grep -nIwiE 'm[a]ster|s[l]ave' -- \
              ':!vendor/' \
              ':!registry/address_by_role_test.go'; then
            echo "Found legacy terminology."
            exit 1
          fi

  build:
    needs: [classify]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify.outputs.skip_full != 'true') }}
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module and build caches on its
          # volume; restoring the 2.9 GB setup-go cache over them only adds tar
          # conflicts, and saving it again fails on the existing key. Hosted
          # runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go vet ./...
      - run: go build ./...
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  test:
    needs: [classify]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify.outputs.skip_full != 'true') }}
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module and build caches on its
          # volume; restoring the 2.9 GB setup-go cache over them only adds tar
          # conflicts, and saving it again fails on the existing key. Hosted
          # runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go test -race -count=1 -timeout 20m ./...
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  driver-imports:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module and build caches on its
          # volume; restoring the 2.9 GB setup-go cache over them only adds tar
          # conflicts, and saving it again fails on the existing key. Hosted
          # runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Driver import policy
        env:
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          GOFLAGS: '-buildvcs=false'
        run: python3 -m unittest discover -s scripts/tests -p driver_imports_test.py
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  tinygo:
    needs: [classify]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify.outputs.skip_full != 'true') }}
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module and build caches on its
          # volume; restoring the 2.9 GB setup-go cache over them only adds tar
          # conflicts, and saving it again fails on the existing key. Hosted
          # runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.40.1'
      - run: |
          mains=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
          if [ -z "$mains" ]; then
            echo "No main packages found; skipping TinyGo build."
            exit 0
          fi
          for pkg in $mains; do
            echo "tinygo build -target esp32 $pkg"
            tinygo build -target esp32 "$pkg"
          done
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  lint:
    needs: [classify]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify.outputs.skip_full != 'true') }}
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module and build caches on its
          # volume; restoring the 2.9 GB setup-go cache over them only adds tar
          # conflicts, and saving it again fails on the existing key. Hosted
          # runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: golangci/golangci-lint-action@v8
        with:
          # Same golangci-lint as the readability baseline job: one version reads .golangci.yml.
          version: v2.11.4
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"
