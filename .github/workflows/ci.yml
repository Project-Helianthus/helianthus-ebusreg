name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminology:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: |
          # Phase C M-C6: AddressByRole(SlotRole) test documents
          # the eBUS-spec SlotRoleMaster/SlotRoleSlave enum values.
          # Preserve the exact quoted B513 feature label; still check other terms on its line.
          if git grep -nIwiE 'm[a]ster|s[l]ave' -- \
              ':!vendor/' \
              ':!registry/address_by_role_test.go' | \
              sed 's/"parameter-master"/"parameter-role"/g' | \
              grep -wiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology."
            exit 1
          fi

  build:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go vet ./...
      - run: go build ./...
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  test:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go test -race -count=1 ./...
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  tinygo:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.40.1'
      - run: |
          mains=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
          if [ -z "$mains" ]; then
            echo "No main packages found; skipping TinyGo build."
            exit 0
          fi
          for pkg in $mains; do
            echo "tinygo build -target esp32 $pkg"
            tinygo build -target esp32 "$pkg"
          done
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  lint:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Scope git config to this job
        run: echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: git config --global url."https://${{ secrets.REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: golangci/golangci-lint-action@v6
      - name: Remove job-scoped git config
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"
