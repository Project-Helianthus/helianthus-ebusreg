name: Go readability
on:
  pull_request:
  push:
    branches: [main]
jobs:
  readability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          skip-cache: true
          install-only: true
      - run: python3 -m unittest discover -s scripts/tests -p test_go_lint_baseline.py -v
      - run: python3 scripts/check_go_lint_baseline.py --check
